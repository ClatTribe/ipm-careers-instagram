<!doctype html>
<html><head><meta charset="utf-8">
<!-- One Instagram Story, 1080 x 1920, white theme. Keep text between y = 260 and y = 1580 (Instagram covers the rest). -->
<style>
  @font-face { font-family: Fraunces; src: url(../public/fonts/fraunces.woff2); font-weight: 100 900; }
  @font-face { font-family: Inter; src: url(../public/fonts/inter.woff2); font-weight: 100 900; }
  @font-face { font-family: Hand; src: url(../public/fonts/shantell-sans.woff2); font-weight: 300 800; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: #fff; font-family: Inter, "Noto Color Emoji", sans-serif; color: #1B1420; }
  .bg { position: absolute; inset: 0;
    background: radial-gradient(ellipse 80% 50% at 50% 45%, rgba(137,55,131,0.07), transparent 70%),
      linear-gradient(to right, #F4EEF4 2px, transparent 2px) 0 0/120px 120px,
      linear-gradient(to bottom, #F4EEF4 2px, transparent 2px) 0 0/120px 120px; }
  .bg.purple { background: radial-gradient(1100px 800px at 110% -10%, rgba(233,164,37,0.30), transparent 55%), linear-gradient(160deg, #893783 0%, #5A1E56 100%); }
  .safe { position: absolute; left: 80px; right: 80px; top: 260px; bottom: 340px; display: flex; flex-direction: column; }
  .logo { height: 84px; align-self: flex-start; }
  .pill { display: inline-block; font: 800 26px Inter; letter-spacing: .12em; text-transform: uppercase; color: #893783; background: #fff;
    border: 2.5px solid #EBD6E8; padding: 14px 26px; border-radius: 999px; }
  .mid { flex: 1; display: flex; flex-direction: column; justify-content: center; }
  h1 { font: 900 112px/1.02 Inter; letter-spacing: -0.035em; }
  h2 { font: 800 76px/1.08 Inter; letter-spacing: -0.025em; }
  em { font-style: normal; background: linear-gradient(180deg, #B04AA6 0%, #6A2565 100%); -webkit-background-clip: text; color: transparent; }
  .purple em { background: none; color: #FFC24D; }
  .sub { font: 400 44px/1.45 Inter; color: #4E4554; margin-top: 30px; }
  .paper { position: relative; background: #FFFDF6; border-radius: 12px; box-shadow: 0 24px 60px rgba(137,55,131,0.13);
    padding: 40px 48px 48px 96px; background-image: repeating-linear-gradient(#FFFDF6 0 70px, #E7E1D2 70px 72px); background-position: 0 104px; }
  .paper:before { content: ""; position: absolute; left: 64px; top: 0; bottom: 0; width: 3px; background: #E8A3A3; }
  .paper .head { font: 700 26px Inter; letter-spacing: .08em; color: #C53030; margin-bottom: 28px; }
  .paper p { font: 400 52px/72px Fraunces, serif; color: #1B1420; }
  .stamp { position: absolute; right: 18px; top: -38px; transform: rotate(7deg); border: 5px solid #C53030; color: #C53030; font: 800 32px Inter;
    padding: 8px 18px; border-radius: 10px; background: rgba(255,255,255,.9); }
  .bar { display: flex; align-items: center; gap: 22px; margin-top: 56px; background: #fff; border: 3px solid #EBD6E8; border-radius: 999px;
    padding: 22px 34px; font: 700 40px Inter; box-shadow: 0 14px 30px rgba(137,55,131,0.10); }
  .dot { width: 22px; height: 22px; border-radius: 11px; background: #E9A425; box-shadow: 0 0 0 8px rgba(233,164,37,.22); }
  .big { font: 900 420px/0.9 Inter; letter-spacing: -0.05em; color: #FFC24D; }
  .hand { font-family: Hand, sans-serif; }
  .reply { margin-top: 44px; font: 600 40px Inter; color: #fff; opacity: .92; }
</style></head>
<body><div id="s"></div>
<script>
const md = (s = "") => String(s).replace(/\*([^*]+)\*/g, "<em>$1</em>").replace(/\n/g, "<br>");
const T = {
  answer: (c) => `<div class="bg"></div><div class="safe">
      <div style="display:flex;justify-content:space-between;align-items:center"><img class="logo" src="../public/brand/logo-full.png"><span class="pill">${md(c.pill)}</span></div>
      <div class="mid"><h2>${md(c.title)}</h2>
        <div class="sub" style="font-size:40px;margin-top:24px">${md(c.question)}</div>
        <div style="display:flex;gap:18px;margin-top:56px;justify-content:center">${c.chips.map((x, i) => `<div style="width:130px;height:180px;border-radius:16px;background:${c.colors[i]};color:#fff;font:800 70px Inter;display:flex;align-items:center;justify-content:center;${i === c.mark ? "outline:8px solid #E9A425;outline-offset:6px" : ""}">${x}</div>`).join("")}</div>
        <div class="hand" style="font-size:88px;font-weight:800;margin-top:70px">Answer: <span style="background:linear-gradient(transparent 40%,rgba(255,179,71,.55) 40%,rgba(255,179,71,.55) 90%,transparent 90%);color:#1A8754;padding:0 8px">${md(c.answer)}</span></div>
        <div class="sub" style="font-size:40px">${md(c.why)}</div>
        <div class="bar" style="margin-top:50px"><span class="dot"></span>${md(c.cta)}</div></div></div>`,
  newpost: (c) => `<div class="bg"></div><div class="safe">
      <div style="display:flex;justify-content:space-between;align-items:center"><img class="logo" src="../public/brand/logo-full.png"><span class="pill">New post</span></div>
      <div class="mid" style="align-items:center">
        <div style="width:760px;border-radius:28px;overflow:hidden;border:3px solid #EBD6E8;box-shadow:0 30px 70px rgba(137,55,131,0.22);transform:rotate(-2deg)"><img src="${c.image}" style="display:block;width:100%"></div>
        <div class="bar" style="margin-top:64px"><span class="dot"></span>${md(c.line || "New on our profile. Go check it out.")}</div></div></div>`,
  teaser: (c) => `<div class="bg"></div><div class="safe">
      <div style="display:flex;justify-content:space-between;align-items:center"><img class="logo" src="../public/brand/logo-full.png"><span class="pill">${md(c.pill)}</span></div>
      <div class="mid"><h2 style="margin-bottom:70px">${md(c.title)}</h2>
        <div class="paper"><div class="head">${md(c.paperHead)}</div><p>${md(c.question)}</p><div class="stamp">${md(c.stamp)}</div></div>
        <div class="bar"><span class="dot"></span>${md(c.when)}</div>
        <div class="sub" style="font-size:38px">${md(c.reply)}</div></div></div>`,
  countdown: (c) => `<div class="bg purple"></div><div class="safe purple" style="color:#fff">
      <img class="logo" src="../public/brand/logo-white.png">
      <div class="mid"><div style="font:700 32px Inter;letter-spacing:.14em;color:#FFC24D">${md(c.kicker)}</div>
        <div class="big">${c.days}</div><h2 style="color:#fff;margin-top:10px">${md(c.title)}</h2>
        <div class="hand" style="margin-top:56px;background:rgba(255,255,255,.1);border:2px solid rgba(255,255,255,.2);border-radius:32px;padding:36px 44px;font-size:46px;line-height:1.45">
          <div style="font:700 26px Inter;letter-spacing:.14em;color:#FFC24D;margin-bottom:10px">TODAY'S ONE THING</div>${md(c.task)}</div>
        <div class="reply">${md(c.reply)}</div></div></div>`,
};
window.render = (story) => { document.getElementById("s").innerHTML = T[story.type](story); };
</script></body></html>
