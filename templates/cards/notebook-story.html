<!doctype html><html><head><meta charset="utf-8">
<!-- Interview Simulator Story as a mentor's notebook page (1080x1920, safe zone y 250-1580). ?d=<json> {n,q,opts,right,why,mode} -->
<style>
@font-face { font-family: Hand; src: url(../../public/fonts/shantell-sans.woff2); font-weight: 300 800; }
@font-face { font-family: Inter; src: url(../../public/fonts/inter.woff2); font-weight: 100 900; }
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:#C9BFAF}
.page{position:absolute;left:36px;top:140px;width:1008px;height:1640px;background:#FFFEF8;transform:rotate(-.8deg);box-shadow:0 24px 48px rgba(0,0,0,.25);
 background-image:repeating-linear-gradient(transparent 0 66px,#B9D3EA 66px 68px);background-position:0 40px}
.page:before{content:"";position:absolute;left:112px;top:0;bottom:0;width:3px;background:#E9A3A3}
.holes{position:absolute;left:34px;top:150px;display:flex;flex-direction:column;gap:420px}.holes i{width:36px;height:36px;border-radius:18px;background:#C9BFAF;box-shadow:inset 0 3px 4px rgba(0,0,0,.2)}
.ink{position:absolute;font-family:Hand;color:#1F3A8A}
.red{color:#C8312B}
.hl{background:linear-gradient(transparent 22%,rgba(255,230,80,.8) 22%,rgba(255,230,80,.8) 88%,transparent 88%);padding:0 6px}
.opt{display:flex;gap:18px;font:500 38px/1.38 Hand;margin-bottom:30px}
.opt b{flex:0 0 auto;font-weight:800}
.x{text-decoration:line-through;text-decoration-color:#C8312B;text-decoration-thickness:4px;opacity:.75}
.ring{position:absolute;border:5px solid #C8312B;border-radius:50%;transform:rotate(-8deg)}
.sticky{position:absolute;background:#FFE27A;transform:rotate(2.5deg);box-shadow:0 12px 20px rgba(0,0,0,.18);padding:24px 26px;font-family:Hand;color:#3A2A00}
</style></head><body><div id="s"></div>
<script>
const d=JSON.parse(decodeURIComponent(new URLSearchParams(location.search).get("d"))), R=d.mode==="reveal";
document.getElementById("s").innerHTML=`<div class="page"><div class="holes"><i></i><i></i><i></i></div>
 <div class="ink" style="left:150px;top:118px;font-size:30px;color:#6B6660">IIM B interview practice · Q${d.n}</div>
 <div class="ink" style="left:150px;top:190px;width:800px;font:800 66px/1.15 Hand;transform:rotate(-1deg)">Panel: <span class="hl">"${d.q}"</span></div>
 <div class="ink red" style="left:150px;top:370px;font:700 36px Hand">${R?"✔ the one that works:":"which opener works best? 🤔"}</div>
 <div class="ink" style="left:150px;right:70px;top:450px">
  ${d.opts.map((o,i)=>`<div class="opt"><b>${"ABC"[i]})</b><span class="${R&&i!==d.right?"x":""}">${o}</span></div>`).join("")}
 </div>
 ${R?`<div class="ring" style="left:128px;top:${d.ringTop}px;width:96px;height:80px"></div>
  <div class="ink red" style="left:150px;right:70px;top:${d.whyTop}px;font:600 34px/1.45 Hand">${d.why.map(w=>"→ "+w).join("<br>")}</div>`
  :`<div class="ink red" style="left:150px;top:${d.voteTop}px;font:700 34px Hand;transform:rotate(-2deg)">vote below 👇 answer tonight at 8</div>`}
 <div class="sticky" style="right:50px;top:1350px;width:380px"><div style="font:800 30px/1.2 Hand">Practise this with IIM alumni</div><div style="font:500 25px/1.3 Hand;margin-top:8px">Unlimited mock interviews<br><b>PI batch · ₹99</b></div></div>
 <div class="ink" style="left:150px;top:1500px;font:500 26px Hand;color:#6B6660">@ipmcareers</div>
</div>`;
</script></body></html>
