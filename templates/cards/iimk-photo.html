<!doctype html><html><head><meta charset="utf-8">
<!-- IIM K BMS 2027 dates on a real IIM Kozhikode campus photo (frame from iimk.ac.in banner video, kept in out/iimk). -->
<style>
@font-face { font-family: Inter; src: url(../../public/fonts/inter.woff2); font-weight: 100 900; }
@font-face { font-family: Fraunces; src: url(../../public/fonts/fraunces.woff2); font-weight: 100 900; }
@font-face { font-family: FrauncesI; src: url(../../public/fonts/fraunces-italic.woff2); font-weight: 100 900; }
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1350px;overflow:hidden;background:#000;font-family:Inter,sans-serif;color:#fff}
.bg{position:absolute;inset:0;width:1080px;height:1350px;object-fit:cover}
.top{position:absolute;left:0;right:0;top:0;height:520px;background:linear-gradient(rgba(10,6,12,.55),rgba(10,6,12,.1) 75%,transparent)}
.bot{position:absolute;left:0;right:0;bottom:0;height:720px;background:linear-gradient(transparent,rgba(10,6,12,.78) 38%,rgba(10,6,12,.92))}
.logo{position:absolute;left:54px;top:50px;height:66px}
.kick{position:absolute;left:58px;top:168px;font:800 28px Inter;letter-spacing:.16em;color:#FFD23F}
.h{position:absolute;left:54px;top:208px;font:800 112px/1 Fraunces;letter-spacing:-1px;text-shadow:0 4px 24px rgba(0,0,0,.4)}
.h i{font-family:FrauncesI;font-weight:600;color:#FFD23F}
.list{position:absolute;left:58px;right:58px;bottom:150px}
.r{display:flex;justify-content:space-between;align-items:baseline;padding:20px 0;border-bottom:1.5px solid rgba(255,255,255,.28)}
.r span{font:600 32px Inter;color:rgba(255,255,255,.82)}
.r b{font:800 40px Inter}
.r.key b{color:#FFD23F;font-size:46px}
.r.key span{color:#fff}
.foot{position:absolute;left:58px;right:58px;bottom:58px;display:flex;justify-content:space-between;align-items:center}
.foot .a{font:600 26px Inter;color:rgba(255,255,255,.85)}
.foot .b{font:800 28px Inter;color:#1B1420;background:#FFD23F;padding:12px 22px;border-radius:999px}
.cr{position:absolute;right:20px;top:1180px;font:500 16px Inter;color:rgba(255,255,255,.5);transform:rotate(-90deg);transform-origin:right top}

body.sq,html.sq{height:1080px}
.sq .bg{height:1080px}
.sq .top{height:420px}
.sq .bot{height:640px}
.sq .kick{top:150px;font-size:26px}
.sq .h{top:188px;font-size:104px}
.sq .list{bottom:118px}
.sq .r{padding:13px 0}
.sq .r span{font-size:28px}
.sq .r b{font-size:36px}
.sq .r.key b{font-size:42px}
.sq .foot{bottom:40px}
</style></head><body>
<img class="bg" src="../../out/iimk/campus.jpg">
<script>if(location.search.includes("sq")){document.documentElement.classList.add("sq");document.body.classList.add("sq");document.querySelector(".bg").src="../../out/iimk/campus-sq.jpg";document.addEventListener("DOMContentLoaded",()=>{document.querySelector(".h").innerHTML="Forms are <i>out.</i>"})}</script>
<div class="top"></div><div class="bot"></div>
<img class="logo" src="../../public/brand/logo-white.png">
<div class="kick">IIM KOZHIKODE · BMS 2027</div>
<div class="h">Forms are<br><i>out.</i></div>
<div class="list">
 <div class="r"><span>Applications open</span><b>25 Nov 2026</b></div>
 <div class="r"><span>Last date to apply</span><b>20 Feb 2027</b></div>
 <div class="r key"><span>Aptitude test (April, not June!)</span><b>11 Apr 2027</b></div>
 <div class="r"><span>Result</span><b>25 Apr 2027</b></div>
 <div class="r" style="border:none"><span>Interviews</span><b>end May / early June</b></div>
</div>
<div class="foot"><span class="a">Official dates · @ipmcareers</span><span class="b">Comment "IIMK" for the prep plan</span></div>
</body></html>
