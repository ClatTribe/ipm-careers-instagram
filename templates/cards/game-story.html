<!doctype html><html><head><meta charset="utf-8">
<!-- Trend Stories (1080x1920), our own take on the "Mission Passed" / "Wasted" game-screen jokes. No game logos, fonts or art. ?c=passed|wasted -->
<style>
@font-face { font-family: Inter; src: url(../../public/fonts/inter.woff2); font-weight: 100 900; }
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:#000;font-family:Inter,"Noto Color Emoji",sans-serif;color:#fff}
.bg{position:absolute;inset:-40px;background-size:cover;background-position:center}
.big{position:absolute;left:0;right:0;text-align:center;font:900 150px/1 Inter;letter-spacing:-2px;transform:skewX(-8deg)}
.sub{position:absolute;left:80px;right:80px;text-align:center;font:800 54px/1.2 Inter}
.card{position:absolute;left:90px;right:90px;background:rgba(0,0,0,.62);border:2px solid rgba(255,255,255,.18);border-radius:26px;padding:34px 40px;backdrop-filter:blur(4px)}
.card small{display:block;font:800 26px Inter;letter-spacing:.16em;margin-bottom:10px}
.card div{font:700 40px/1.3 Inter}
.logo{position:absolute;left:80px;top:270px;height:66px}
.stk{position:absolute;left:0;right:0;text-align:center;font:600 30px Inter;color:rgba(255,255,255,.75)}
</style></head><body><div id="s"></div>
<script>
const c=new URLSearchParams(location.search).get("c")||"passed";
const V={
passed:()=>`<div class="bg" style="background-image:url(../../media/cartoons/chai2.png);filter:blur(6px) brightness(.45) saturate(1.2)"></div>
 <img class="logo" src="../../public/brand/logo-white.png">
 <div class="big" style="top:560px;color:#FFC24D;text-shadow:0 6px 0 #000,0 0 40px rgba(255,194,77,.35)">MISSION<br>PASSED!</div>
 <div class="sub" style="top:900px;color:#fff;text-shadow:0 3px 0 #000">RESPECT +</div>
 <div class="sub" style="top:1000px;font-size:50px;color:#fff">CHRIST form submitted ✅</div>
 <div class="card" style="top:1150px"><small style="color:#FFC24D">NEXT MISSION</small><div>Entrance test · 5 Dec<br><span style="font-weight:500;color:#ddd">Objective: 10 full mocks before then</span></div></div>
 <div class="stk" style="top:1440px">👇 free CHRIST mock</div>`,
wasted:()=>`<div class="bg" style="background-image:url(../../media/cartoons/chai2.png);filter:blur(3px) grayscale(1) brightness(.55) contrast(1.1)"></div>
 <div style="position:absolute;inset:0;background:radial-gradient(ellipse at center,rgba(120,0,0,.15),rgba(0,0,0,.55))"></div>
 <img class="logo" src="../../public/brand/logo-white.png">
 <div class="big" style="top:640px;color:#D8312B;font-size:190px;text-shadow:0 6px 0 #000">WASTED</div>
 <div class="sub" style="top:890px">4 wrong guesses =<br>1 right answer gone.</div>
 <div class="card" style="top:1100px"><small style="color:#FF8A80">CHRIST BBA TEST · 5 DEC</small><div>-0.25 for every wrong answer.<br><span style="font-weight:500;color:#ddd">Not sure? Skip it. Practise skipping in a full mock.</span></div></div>
 <div class="stk" style="top:1440px">👇 10 full mocks, real pattern</div>`,
};
document.getElementById("s").innerHTML=V[c]();
</script></body></html>
