<!doctype html><html><head><meta charset="utf-8">
<!-- Editorial cartoon post (1080x1080): illustration + speech bubbles + small header + signature. ?d=<json data file> -->
<style>
@font-face { font-family: Inter; src: url(../../public/fonts/inter.woff2); font-weight: 100 900; }
@font-face { font-family: Fraunces; src: url(../../public/fonts/fraunces.woff2); font-weight: 100 900; }
@font-face { font-family: FrauncesI; src: url(../../public/fonts/fraunces-italic.woff2); font-weight: 100 900; }
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1080px;overflow:hidden;background:#fff}
.art{position:absolute;inset:0;width:1080px;height:1080px;object-fit:cover}
.frame{position:absolute;inset:10px;border:3px solid #2a2a2a;pointer-events:none}
.b{position:absolute;background:#fff;border:4px solid #1b1b1b;border-radius:34px;padding:22px 34px;font:800 46px/1.18 Inter;color:#1b1b1b;text-align:center;box-shadow:0 4px 0 rgba(0,0,0,.08)}
.b.red{color:#B3261E}
.tail{position:absolute;width:0;height:0}
.hdr{position:absolute;right:46px;top:44px;text-align:right;font:700 26px Inter;color:#444;line-height:1.35}
.hdr b{display:block;color:#B3261E;font-weight:800}
.sig{position:absolute;left:46px;bottom:40px;text-shadow:0 2px 6px rgba(255,255,255,.9),0 0 2px #fff}
.sig .n{font:italic 700 46px FrauncesI;color:#B3261E}
.sig .s{font:600 22px Inter;color:#333;margin-top:2px}
</style></head><body><div id="s"></div>
<script>
const d=JSON.parse(decodeURIComponent(new URLSearchParams(location.search).get("d")));
let h=`<img class="art" src="${d.art}"><div class="frame"></div>`;
if(d.hdr) h+=`<div class="hdr" style="${d.hdrStyle||""}">${d.hdr[0]}<b>${d.hdr[1]}</b></div>`;
for(const b of d.bubbles){
  h+=`<svg style="position:absolute;left:0;top:0;width:1080px;height:1080px;overflow:visible"><polygon points="${b.tail}" fill="#fff" stroke="#1b1b1b" stroke-width="4" stroke-linejoin="round"/></svg>`;
  h+=`<div class="b ${b.red?"red":""}" style="left:${b.x}px;top:${b.y}px;width:${b.w}px;font-size:${b.fs||46}px">${b.t}</div>`;
}
h+=`<div class="sig" style="${d.sigStyle||""}"><div class="n">IPM Careers</div><div class="s">run by IIM alumni · @ipmcareers</div></div>`;
document.getElementById("s").innerHTML=h;
</script></body></html>
